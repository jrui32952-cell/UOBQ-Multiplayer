<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>UOBQ · 单人对战</title>
  <link rel="icon" href="assets/moon-house-logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="table-app">
    <header class="table-top">
      <a href="index.html" class="table-brand"><img src="assets/moon-house-logo.png" alt="UOBQ Logo"> UOBQ</a>
      <span class="mode-chip">单人 · 与电脑对战</span>
      <div class="top-actions"><span class="match-pill" id="scorePill">你 0 / 电脑 0 · 目标100</span><button class="subtle-button" id="openRecap">战绩复盘</button><button class="subtle-button" id="restart">新建比赛 ↻</button></div>
    </header>

    <main class="table-main">
      <div class="status-row">
        <div class="game-status" id="status" role="status" aria-live="polite"></div>
        <div class="turn-caption" id="turnCaption">准备开始</div>
      </div>

      <section class="opponent area" id="aiArea">
        <div class="area-label"><span class="avatar">🐶</span><strong>电脑对手</strong><span class="turn-indicator" id="aiBadge">等待中</span></div>
        <div class="cards" id="aiCards"></div>
      </section>

      <div class="middle-grid">
        <section class="table-center" id="centerArea">
          <div class="pile-wrap" id="drawWrap">
            <div class="pile-label">摸牌堆</div>
            <button id="drawDeck" class="game-card deck-card" aria-label="从摸牌堆摸牌"><img class="card-art" src="assets/cards/card-back.svg" alt="盖住的卡牌"></button>
            <small id="deckCount"></small>
          </div>

          <div class="center-actions">
            <div class="drawn-title">当前操作区</div>
            <div class="drawn-slot" id="drawnSlot"></div>
            <div class="decision-buttons">
              <button class="control primary" id="discardDrawn" hidden>弃掉摸到的牌</button>
              <button class="control secondary" id="useAbility" hidden>使用能力</button>
              <button class="control cabo" id="callCabo">宣告 CABO ✦</button>
            </div>
          </div>

          <div class="pile-wrap" id="discardWrap">
            <div class="pile-label">弃牌堆</div>
            <div id="discardPile" class="game-card discard-card"><span>—</span></div>
            <small>可直接拿最上方明牌</small>
          </div>
        </section>

        <aside class="public-log panel" id="logPanel">
          <h3>公开操作</h3>
          <ul id="publicLog"></ul>
          <p class="log-tip">所有玩家都能看到位置变化，但看不到隐藏数值。</p>
        </aside>
      </div>

      <section class="player area" id="playerArea">
        <div class="area-label"><span class="avatar">🐰</span><strong>你的四张牌</strong><span class="turn-indicator" id="playerBadge">准备中</span></div>
        <div class="cards" id="playerCards"></div>
        <p class="help-line" id="helper">开局会先查看两张牌。</p>
      </section>
    </main>

    <footer class="table-footer">固定牌位 #1–#4 从左到右不变 · 明牌持续公开 <span>UOBQ V1.11 测试版</span></footer>
  </div>

  <div class="game-overlay" id="gameOverlay" hidden>
    <div class="game-dialog" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <h2 id="overlayTitle"></h2>
      <div id="overlayBody"></div>
      <div id="overlayButtons" class="overlay-buttons"></div>
    </div>
  </div>

  <div class="game-overlay recap-overlay" id="recapOverlay" hidden>
    <div class="game-dialog recap-dialog" role="dialog" aria-modal="true" aria-labelledby="recapTitle">
      <div class="recap-top"><h2 id="recapTitle">战绩复盘</h2><button class="subtle-button" id="closeRecap" aria-label="关闭战绩复盘">✕</button></div>
      <div id="recapContent"></div>
    </div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay" hidden>
    <div class="countdown-badge" id="countdownNumber">3</div>
    <p id="countdownText">准备开始</p>
  </div>

  <div class="action-flash" id="actionFlash" hidden>
    <div class="flash-card"><strong id="flashTitle">摸牌</strong><span id="flashBody">请选择你的下一步</span></div>
  </div>

  <script src="game-rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
